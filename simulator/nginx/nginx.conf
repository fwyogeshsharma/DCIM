server {
    listen 80;
    server_name fwdcim.faberwork.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name fwdcim.faberwork.com;

    ssl_certificate     /etc/letsencrypt/live/fwdcim.faberwork.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fwdcim.faberwork.com/privkey.pem;

    # Modern TLS only
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           SAMEORIGIN                            always;
    add_header X-Content-Type-Options    nosniff                               always;

    # Proxy all traffic to the Vite preview + proxy-server inside dcim-ui
    location / {
        proxy_pass         http://dcim-ui:5173;
        proxy_http_version 1.1;

        # WebSocket / SSE headers
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering and keep connection alive
        proxy_buffering         off;
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;
        proxy_cache_bypass      $http_upgrade;
    }
}

# Required for WebSocket / SSE connection upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
