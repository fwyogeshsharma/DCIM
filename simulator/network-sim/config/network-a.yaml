network_id: network-a
topology_file: /app/topologies/large_datacenter_3tier.json
topology_name: "Network A - 3-Tier Production Datacenter"
dcim_server_url: http://dcim-server-a:8080/api/v1

simulation:
  tick_interval: 30
  snmp_sync_every: 1
  speed_multiplier: 1.0

protocols:
  snmp:
    enabled: true
    port: 161
  gnmi:
    enabled: true
    port: 57400
  sflow:
    enabled: true
    target_ip: "dcim-server-a"
    target_port: 6343
    interval: 30
    sample_rate: 1000
  traps:
    enabled: true
    target_ip: "dcim-server-a"
    target_port: 162

network:
  packet_loss_pct: 0
  link_latency_ms: 5
  intermittent: false
  online_duration_sec: 0
  offline_duration_sec: 0

telemetry_profile:
  cpu_base: 40
  memory_base: 55
  cpu_spike_chance: 0.01
  link_flap_chance: 0.002
