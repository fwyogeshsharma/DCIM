# DCIM Server — Docker/Simulator configuration
# Plain HTTP on port 8080, SQLite database, no license enforcement

server:
  address: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s
  max_body_size: 10485760

server_id:
  id: ""
  name: "DCIM-Server-Docker"
  location: "Simulator"
  environment: "development"
  auto_generate: true

tls:
  enabled: false

database:
  type: "postgres"
  postgres:
    host: "timescaledb"
    port: 5432
    user: "dcim"
    password: "dcim_pas"
    database: "dcim_db"
    sslmode: "disable"
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: 300s
  retention:
    metrics_days: 7
    alerts_days: 30
    agent_status_days: 7
    cleanup_interval: 24h

license:
  mode: "disabled"
  enforce: false

agents:
  connection:
    heartbeat_timeout: 300s
    identification_method: "agent_id"
  registration:
    auto_register: true
    require_approval: false
    default_group: "simulator"
  validation:
    reject_old_metrics: 24h
    reject_future_metrics: 5m
    max_metrics_per_batch: 1000
    max_alerts_per_batch: 100

api:
  version: "v1"
  base_path: "/api/v1"
  rate_limiting:
    enabled: false
  compression:
    enabled: true
    min_size: 1024
    level: 6
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["Content-Type", "Authorization", "X-Agent-ID"]
    allow_credentials: false

logging:
  level: "info"
  output: "console"
  format: "text"
  include_caller: false
  log_requests: false

alerting:
  enabled: true
  aggregation_window: 5m
  notifications:
    email:
      enabled: false
    webhook:
      enabled: false
    slack:
      enabled: false

metrics:
  aggregation:
    enabled: true
    intervals:
      - interval: 1m
        retention: 168h
      - interval: 1h
        retention: 720h

dashboard:
  enabled: true
  port: 8080
  auth:
    enabled: false

health:
  enabled: true
  path: "/health"
  detailed: true
  check_interval: 30s

performance:
  workers:
    metric_processors: 4
    alert_processors: 2
    database_writers: 2
  buffers:
    metrics: 500
    alerts: 50
  batch:
    metrics_batch_size: 200
    batch_timeout: 5s

debug:
  enabled: false
  profiling: false

snmp_walker:
  enabled: false

snmp_discovery:
  enabled: false
