version: "3.9"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  dcim-backend:
    driver: bridge
  sim-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  timescaledb-data:
  redis-data:
  dcim-server-a-data:
  dcim-server-b-data:
  dcim-server-c-data:
  certbot_webroot:
  certbot_certs:

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── TimescaleDB (PostgreSQL + time-series) ──────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: timescaledb
    environment:
      POSTGRES_USER: dcim
      POSTGRES_PASSWORD: dcim_pas
      POSTGRES_DB: dcim_aggregator
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    networks: [dcim-backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcim -d dcim_aggregator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks: [dcim-backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

