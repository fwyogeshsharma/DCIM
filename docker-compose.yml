  # ── DCIM Aggregator ──────────────────────────────────────────────────────────
  aggregator:
    build:
      context: ./DCIM_Aggregator
      dockerfile: Dockerfile
    container_name: aggregator
    environment:
      NODE_ENV: production
      PORT: 3002
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: dcim_aggregator
      POSTGRES_USER: dcim
      POSTGRES_PASSWORD: dcim_pas
      REDIS_URL: redis://redis:6379
      # DCIM Server endpoints (comma-separated for multi-server awareness)
      DCIM_SERVER_URLS: "http://dcim-server-a:8080,http://dcim-server-b:8080,http://dcim-server-c:8080"
      # API key for the external ingest endpoint — change before going to production
      INGEST_API_KEY: "74613fe24e4da087f46d584c6558870a3bed6b993a6416ced4df17f9a0f1e824"
    ports:
      - "3002:3002"
    networks: [dcim-backend]
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── DCIM UI ──────────────────────────────────────────────────────────────────
  dcim-ui:
    build:
      context: ./DCIM_UI
      dockerfile: Dockerfile
    container_name: dcim-ui
    environment:
      DCIM_SERVER_URL: http://dcim-server-a:8080
      AGGREGATOR_URL: http://aggregator:3002
      VITE_API_BASE: http://localhost:3001
      ORCHESTRATOR_URL: http://orchestrator:8099
    ports:
      - "8000:8000"   # Vite preview
      - "3001:3001"   # Proxy server
    networks: [dcim-backend]
    depends_on:
      aggregator:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

